  <text class="tag" x="164" y="142">HL</text>
  <text class="tag" x="284" y="80">LH</text>
  <text class="tag" x="404" y="122">HL</text>

  <text class="slot" x="42" y="244">S4</text>
  <text class="slot" x="162" y="244">S3</text>
  <text class="slot" x="282" y="244">S2</text>
  <text class="slot" x="402" y="244">S1</text>

  <text class="meta" x="36" y="268">Oldest</text>
  <text class="meta" x="386" y="268">Present</text>

