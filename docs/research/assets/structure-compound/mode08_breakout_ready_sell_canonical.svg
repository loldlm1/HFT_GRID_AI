      .tag { fill:#ff8bc1; font: 12px monospace; font-weight:700; }
      .entry { fill:#ffe082; font: 12px monospace; font-weight:700; }
      .intent { fill:#b9c7f2; font: 11px monospace; }
      .rule { fill:#8fa3d9; font: 10px monospace; }
      .line { stroke:#ff2d8b; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .guide { stroke:#223056; stroke-width:1; stroke-dasharray:3 4; }
