  <rect class="bg" x="0" y="0" width="560" height="300" rx="10" />

  <text class="title" x="20" y="26">Mode 8 · BREAKOUT_READY_SELL · Canonical</text>
  <text class="meta" x="20" y="44">Breakout · left=oldest (S4)  right=present (S1)</text>
  <text class="intent" x="20" y="62">Sell-side breakout prep: volatility compression / squeeze</text>
  <text class="rule" x="20" y="78">Check: S2(LH)<S4(LH), S1(HL)>S3(HL)</text>

  <line class="guide" x1="56" y1="92" x2="56" y2="220" />
  <line class="guide" x1="176" y1="92" x2="176" y2="220" />
  <line class="guide" x1="296" y1="92" x2="296" y2="220" />
  <line class="guide" x1="416" y1="92" x2="416" y2="220" />

  <line class="base" x1="24" y1="220" x2="536" y2="220" />

  <polyline class="line" points="56,74 176,156 296,94 416,136" marker-end="url(#arrow)" />

  <circle cx="56" cy="74" r="4" fill="#ff2d8b" />
  <circle cx="176" cy="156" r="4" fill="#ff2d8b" />
  <circle cx="296" cy="94" r="4" fill="#ff2d8b" />
  <circle cx="416" cy="136" r="4" fill="#ff2d8b" />

